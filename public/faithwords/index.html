<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fbf4e8" />
  <meta name="description" content="Play FaithWords — find words and uncover Scripture." />
  <title>FaithWords | FaithCraft</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; background: #fbf4e8; }
    body { min-height: 100dvh; overflow: hidden; }
    iframe {
      display: block;
      width: 100vw;
      height: 100dvh;
      border: 0;
      background: #fbf4e8;
    }
    .fallback {
      position: fixed;
      inset: auto 12px max(12px, env(safe-area-inset-bottom)) 12px;
      z-index: 2;
      text-align: center;
      pointer-events: none;
      font: 600 12px/1.35 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: transparent;
    }
    .fallback a { pointer-events: auto; color: inherit; }
  </style>
</head>
<body>
  <iframe
    src="https://britbrae08.github.io/sling/"
    title="Play FaithWords"
    allow="fullscreen"
    loading="eager"
  ></iframe>
  <p class="fallback">If FaithWords does not appear, <a href="https://britbrae08.github.io/sling/">open it directly</a>.</p>
</body>
</html>
